<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Secure</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;padding:15px}.box{background:#111;padding:20px;border-radius:20px;max-width:380px;margin:50px auto}input{width:100%;padding:13px;margin:6px 0;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:#fff}button{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;margin-top:8px;cursor:pointer}.red{background:#ff2d55;color:#fff}.white{background:#fff;color:#000}.card{background:#111;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #222}.hidden{display:none}</style></head><body>
<div id="loginBox" class="box"><h2>🔐 Secure Admin Login</h2><p style="color:#888;font-size:13px">Only: successbrownson222@gmail.com</p>
<input id="email" value="successbrownson222@gmail.com"><input id="pass" type="password" placeholder="Password e.g. admine123">
<button class="red" onclick="login()">Login Securely</button>
<button class="white" onclick="signup()">First time? Create Admin Account</button>
<p id="msg" style="font-size:13px;margin-top:8px;color:#0f0;white-space:pre-wrap"></p></div>
<div id="dash" class="box hidden" style="max-width:500px"><h3>Admin Dashboard <button onclick="logout()" style="width:auto;float:right;background:#222;color:#fff;padding:6px 12px">Out</button></h3><p id="who" style="color:#888"></p><hr style="margin:10px 0;border-color:#222"><input id="name" placeholder="Product Name"><input id="price" type="number" placeholder="Price"><input id="image" placeholder="Image URL"><input id="category" placeholder="Category"><button class="red" onclick="addProduct()">Add Product</button><p id="msg2"></p><div id="list"></div></div>
<script>
let ADMIN="";
async function api(path,body){ try{ let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return await r.json(); }catch(e){ return {error:e.message} } }
async function login(){
 document.getElementById('msg').innerText='Checking...';
 let email=document.getElementById('email').value.trim().toLowerCase(), pass=document.getElementById('pass').value;
 let d=await api('/api/auth/login',{email,password:pass});
 if(d.ok){ ADMIN=email; localStorage.setItem('admin',JSON.stringify(d.user)); document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); document.getElementById('who').innerText=email+' ('+d.user.role+')'; load(); document.getElementById('msg').innerText=''; }
 else document.getElementById('msg').innerText='❌ '+(d.error||'Failed');
}
async function signup(){
 document.getElementById('msg').innerText='Creating admin account...';
 let email=document.getElementById('email').value.trim().toLowerCase(), pass=document.getElementById('pass').value;
 if(pass.length<6) return document.getElementById('msg').innerText='Password must be 6+ chars';
 let d=await api('/api/auth/signup',{email,password:pass,name:'Admin'});
 document.getElementById('msg').innerText= d.ok?'✅ Created! Now click Login Securely':'❌ '+(d.error||'Error');
}
function logout(){ localStorage.removeItem('admin'); location.reload(); }
async function load(){ let r=await fetch('/api/products'); let j=await r.json(); let arr=Array.isArray(j)?j:j.products||[]; document.getElementById('list').innerHTML=arr.map(p=>`<div class="card"><img src="${p.image}" style="width:100%;height:100px;object-fit:cover;border-radius:8px"><b>${p.name}</b> $${p.price}<br><button onclick="del(${p.id})" style="width:auto;background:red;color:#fff;padding:5px 12px">Delete</button></div>`).join(''); }
async function addProduct(){ let b={name:document.getElementById('name').value,price:parseInt(document.getElementById('price').value),image:document.getElementById('image').value,category:document.getElementById('category').value,admin_email:ADMIN}; let r=await fetch('/api/admin/add-product',{method:'POST',headers:{'Content-Type':'application/json','x-admin-email':ADMIN},body:JSON.stringify(b)}); let d=await r.json(); document.getElementById('msg2').innerText=d.success?'✅ Added':'❌ '+(d.error); if(d.success) load(); }
async function del(id){ if(!confirm('Delete '+id))return; let r=await fetch(`/api/admin/delete-product?product_id=${id}&admin_email=${encodeURIComponent(ADMIN)}`,{method:'POST'}); let d=await r.json(); alert(JSON.stringify(d)); load(); }
let s=localStorage.getItem('admin'); if(s){ try{ let u=JSON.parse(s); ADMIN=u.email; document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); document.getElementById('who').innerText=u.email; load(); }catch{} }
</script></body></html>
