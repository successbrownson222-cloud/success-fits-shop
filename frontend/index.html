<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Success Fits - Shoes, Clothes & Jewelry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#000;color:#fff;padding:15px}
h1{font-size:28px;font-weight:900;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.top{display:flex;gap:8px;align-items:center;background:#111;padding:10px;border-radius:12px;margin-bottom:12px}
input{flex:1;padding:12px;border-radius:8px;border:none;background:#222;color:#fff;width:100%;margin-bottom:8px}
.btn{padding:12px 16px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.login{background:#ff2d55;color:#fff}
.out{background:#333;color:#fff}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.filters button{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#111;color:#ccc;transition:.2s}
.filters button.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{background:#111;border-radius:16px;overflow:hidden;padding:8px;animation:pop.5s both;transition:.3s}
.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 10px 25px rgba(255,45,85,.25)}
.card img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.card h3{font-size:13px;margin:6px 0}
.card p{color:#ff2d55;font-weight:800}
.card button{width:100%;margin-top:6px;padding:10px;background:#fff;color:#000;border:none;border-radius:8px;font-weight:800}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 20px;border-radius:30px;font-weight:800;display:none;z-index:999}
#cartDrawer{position:fixed;top:0;right:-100%;width:90%;max-width:380px;height:100%;background:#0f0f0f;padding:20px;transition:.4s;z-index:100;overflow-y:auto;display:flex;flex-direction:column}
#cartDrawer.open{right:0}
.cartItem{display:flex;gap:10px;background:#1a1a1a;padding:10px;border-radius:12px;margin-bottom:8px;align-items:center}
.cartItem img{width:55px;height:55px;border-radius:8px;object-fit:cover}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:90}
.overlay.show{display:block}
#authModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200}
#authModal.show{display:flex}
.authBox{background:#111;width:92%;max-width:360px;padding:20px;border-radius:20px;animation:pop.4s}
.checkout{background:#1a1a1a;padding:14px;border-radius:14px;margin-top:auto}
</style>
</head>
<body>
<div id="toast"></div>
<div id="overlay" class="overlay" onclick="closeCart()"></div>

<!-- AUTH MODAL - THIS WAS MISSING BEFORE -->
<div id="authModal" onclick="if(event.target==this)closeAuth()"><div class="authBox">
<h2 id="authTitle" style="font-weight:900">Create Account</h2>
<p style="color:#888;font-size:13px;margin:6px 0 10px">Signup / Sign in to Success Fits</p>
<input id="a_name" placeholder="Full Name (for signup)">
<input id="a_email" placeholder="Email">
<input id="a_pass" type="password" placeholder="Password (min 6 chars)">
<button class="btn login" style="width:100%;margin-top:6px" onclick="doAuth()">Continue</button>
<p style="text-align:center;margin-top:10px;font-size:13px"><span onclick="toggleAuth()" id="authSwitch" style="color:#ff2d55;cursor:pointer;text-decoration:underline">Have account? Login</span> • <span onclick="closeAuth()" style="color:#888">Close</span></p>
<div id="authMsg" style="font-size:12px;color:#0f0;margin-top:8px"></div>
</div></div>

<div id="cartDrawer">
<h2 style="font-weight:900">Cart (<span id="cartCount2">0</span>) <span style="float:right;cursor:pointer" onclick="closeCart()">✕</span></h2>
<div id="cartList" style="margin-top:15px;flex:1"></div>
<div class="checkout">
<input id="c_fullname" placeholder="Full Name for delivery">
<input id="c_address" placeholder="Delivery Address">
<input id="c_phone" placeholder="Phone Number">
<div style="display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin:10px 0"><span>Total:</span><span id="c_total">$0</span></div>
<button onclick="doCheckout()" style="width:100%;background:#ff2d55;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:900">Checkout • Pay Now</button>
<button onclick="clearAll()" style="width:100%;margin-top:8px;background:#222;color:#fff;padding:10px;border:none;border-radius:10px">Clear Cart</button>
</div>
</div>

<h1>SUCCESS FITS. <span onclick="openCart()" style="cursor:pointer">🛒 <span id="count" style="background:#ff2d55;padding:4px 10px;border-radius:12px">0</span></span></h1>

<div class="top">
<div style="flex:1"><div style="font-size:11px;color:#888">Logged in as</div><div id="who" style="font-weight:800;font-size:13px">not logged</div><div id="status" style="font-size:11px;color:#0f0">Logged out</div></div>
<button class="btn login" onclick="openAuth()">Login / Signup</button>
<button class="btn out" onclick="logout()">Out</button>
</div>

<div class="filters">
<button class="active" onclick="filterCat('All',this)">All</button>
<button onclick="filterCat('Shoes',this)">Shoes</button>
<button onclick="filterCat('Clothes',this)">Clothes</button>
<button onclick="filterCat('Jewelry',this)">Jewelry</button>
<button onclick="filterCat('Accessories',this)">Accessories</button>
</div>
<div id="grid" class="grid"></div>

<script>
let PRODUCTS=[]; let CART=[]; let user=null; let authMode='signup'; let currentCat='All';
const ADMIN_EMAIL="successbrownson222@gmail.com";

function init(){
 let savedUser=localStorage.getItem('sf_user'); if(savedUser){ try{ user=JSON.parse(savedUser); document.getElementById('who').innerText=user.email; document.getElementById('status').innerText='Logged in! Cart synced: '+(CART.length); }catch{} }
 let savedCart=localStorage.getItem('sf_cart_'+(user?.email||'guest')); if(savedCart){ try{ CART=JSON.parse(savedCart); }catch{} }
 fetch('/api/products').then(r=>r.json()).then(d=>{ let arr=Array.isArray(d)?d:(d.products||d); if(arr&&arr.length){ PRODUCTS=arr; render(PRODUCTS); } }).catch(()=>{ PRODUCTS=[ {id:1,name:"White sneakers",price:150,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",category:"Shoes"}, {id:2,name:"Black T-shirt",price:85,image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500",category:"Clothes"} ]; render(PRODUCTS); });
 updateCartUI();
}
function showToast(m){ let t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); }
function render(list){
 let g=document.getElementById('grid'); g.innerHTML="";
 list.forEach((p,i)=>{ g.innerHTML+=`<div class="card" style="animation-delay:${i*0.05}s"><img src="${p.image}"><h3>${p.name}</h3><p>$${p.price}</p><button onclick="addToCart(${p.id})">Add to Cart</button></div>` })
}
function filterCat(cat,btn){ currentCat=cat; document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active'); render(cat==='All'?PRODUCTS:PRODUCTS.filter(x=>x.category===cat)); }

function openAuth(){ document.getElementById('authModal').classList.add('show'); }
function closeAuth(){ document.getElementById('authModal').classList.remove('show'); }
function toggleAuth(){ authMode=authMode==='signup'?'login':'signup'; document.getElementById('authTitle').innerText=authMode==='signup'?'Create Account':'Login'; document.getElementById('a_name').style.display=authMode==='signup'?'block':'none'; document.getElementById('authSwitch').innerText=authMode==='signup'?'Have account? Login':'Need account? Signup'; }

async function doAuth(){
 let name=document.getElementById('a_name').value.trim(), email=document.getElementById('a_email').value.trim().toLowerCase(), pass=document.getElementById('a_pass').value;
 if(!email||!pass) return alert('Fill email & password');
 if(pass.length<6) return alert('Password min 6 chars');
 document.getElementById('authMsg').innerText='Loading...';
 let url=authMode==='signup'?'/api/auth/signup':'/api/auth/login';
 let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,name})});
 let d=await r.json();
 if(d.ok){
   if(authMode==='signup'){ document.getElementById('authMsg').innerText='✅ Account created! Now login'; toggleAuth(); showToast('Account created, now login'); }
   else{
     user=d.user; localStorage.setItem('sf_user',JSON.stringify(user)); document.getElementById('who').innerText=user.email; document.getElementById('status').innerText='Logged in! Cart synced: '+CART.length; closeAuth(); showToast('Welcome '+user.email); saveCart();
     // sync cart from server
     let cartRes=await fetch('/api/cart?email='+encodeURIComponent(email)); let cartData=await cartRes.json(); if(cartData.items&&cartData.items.length){ CART=cartData.items.map(it=>({...it,qty:1})); saveCart(); }
   }
 } else document.getElementById('authMsg').innerText='❌ '+(d.error||'Error');
}
function logout(){ if(user) localStorage.setItem('sf_cart_'+user.email, JSON.stringify(CART)); localStorage.removeItem('sf_user'); user=null; CART=[]; document.getElementById('who').innerText='not logged'; document.getElementById('status').innerText='Logged out'; updateCartUI(); showToast('Logged out'); closeCart(); }
function saveCart(){ localStorage.setItem('sf_cart_'+(user?.email||'guest'), JSON.stringify(CART)); updateCartUI(); }
function addToCart(id){
 if(!user){ openAuth(); return showToast('Please signup/login first'); }
 let prod=PRODUCTS.find(p=>p.id==id); if(!prod) return;
 let exist=CART.find(c=>c.id==id); if(exist) exist.qty++; else CART.push({...prod,qty:1});
 saveCart(); showToast(prod.name+' added'); openCart();
 if(user) fetch('/api/cart/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,product_id:id})}).catch(()=>{});
}
function updateCartUI(){
 document.getElementById('count').innerText=CART.reduce((s,c)=>s+c.qty,0);
 document.getElementById('cartCount2').innerText=CART.reduce((s,c)=>s+c.qty,0);
 let list=document.getElementById('cartList'); list.innerHTML=""; let total=0;
 CART.forEach((p,i)=>{ total+=p.price*p.qty; list.innerHTML+=`<div class="cartItem"><img src="${p.image}"><div style="flex:1"><div style="font-weight:800">${p.name}</div><div style="color:#ff2d55">$${p.price} x ${p.qty}</div><div style="display:flex;gap:6px;margin-top:4px"><button onclick="changeQty(${i},-1)" style="width:24px">-</button><span>${p.qty}</span><button onclick="changeQty(${i},1)" style="width:24px">+</button></div></div><button onclick="removeItem(${i})" style="background:#222;border:none;color:#fff;padding:6px 10px;border-radius:6px">X</button></div>` });
 document.getElementById('c_total').innerText='$'+total;
 if(CART.length==0) list.innerHTML='<div style="color:#888;text-align:center;margin-top:30px">Cart empty<br>Add drip 🛒</div>';
}
function changeQty(i,d){ CART[i].qty=Math.max(1,CART[i].qty+d); saveCart(); }
function removeItem(i){ CART.splice(i,1); saveCart(); if(user){ fetch('/api/cart/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email})}).then(()=>{ CART.forEach(it=>{ for(let q=0;q<it.qty;q++) fetch('/api/cart/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,product_id:it.id})}) }) }); } }
function clearAll(){ CART=[]; saveCart(); if(user) fetch('/api/cart/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email})}).catch(()=>{}); showToast('Cart cleared'); }
function openCart(){ document.getElementById('cartDrawer').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeCart(){ document.getElementById('cartDrawer').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
async function doCheckout(){
 if(!user) return openAuth();
 let name=document.getElementById('c_fullname').value, addr=document.getElementById('c_address').value, phone=document.getElementById('c_phone').value;
 if(!name||!addr||!phone) return alert('Fill Full Name, Address & Phone - required');
 let total=CART.reduce((s,c)=>s+c.price*c.qty,0);
 if(CART.length==0) return alert('Cart empty');
 let r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,name,address:addr,phone,items:CART,total})});
 let d=await r.json();
 if(d.success||d.message){ showToast('Order placed! $'+total); CART=[]; saveCart(); closeCart(); }
 else alert(d.error||'Checkout error');
}
init();
</script>
</body>
</html>
