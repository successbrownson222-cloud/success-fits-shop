<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Success Fits - Shoes, Clothes & Jewelry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#000;color:#fff;padding:15px}
h1{font-size:28px;font-weight:900;margin:10px 0}
.top{display:flex;gap:8px;align-items:center;background:#111;padding:10px;border-radius:12px;margin-bottom:12px}
input{flex:1;padding:12px;border-radius:8px;border:none;background:#222;color:#fff}
.btn{padding:12px 16px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.login{background:#ff2d55;color:#fff}
.out{background:#333;color:#fff}
.cart{background:#111;padding:6px 12px;border-radius:20px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.filters button{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#111;color:#ccc;white-space:nowrap}
.filters button.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{background:#111;border-radius:12px;overflow:hidden;padding:8px}
.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.card h3{font-size:13px;margin:6px 0}
.card p{color:#ff2d55;font-weight:800}
.card button{width:100%;margin-top:6px;padding:8px;background:#fff;color:#000;border:none;border-radius:6px;font-weight:700}
#status{color:#0f0;font-size:12px;margin:6px 0}
</style>
</head>
<body>
<h1>SUCCESS FITS. <span style="float:right">🛒 <span id="count" style="background:#ff2d55;padding:2px 8px;border-radius:10px">0</span></span></h1>
<div class="top">
<input id="email" placeholder="Email to login (same on mobile)">
<button class="btn login" onclick="login()">Login</button>
<button class="btn out" onclick="logout()">Out</button>
</div>
<div id="status"></div>
<div>Logged in as: <span id="who">not logged</span></div>
<div class="filters">
<button class="active" onclick="filterCat('All',this)">All</button>
<button onclick="filterCat('Shoes',this)">Shoes</button>
<button onclick="filterCat('Clothes',this)">Clothes</button>
<button onclick="filterCat('Jewelry',this)">Jewelry</button>
<button onclick="filterCat('Accessories',this)">Accessories</button>
</div>
<div id="grid" class="grid"></div>

<script>
const API = ""; // same origin
let PRODUCTS = [
 {id:1,name:"Running Shoes",category:"Shoes",price:89,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
 {id:2,name:"Denim Jacket",category:"Clothes",price:120,image:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500"},
 {id:3,name:"Gold Necklace",category:"Jewelry",price:250,image:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=500"},
 {id:4,name:"Leather Bag",category:"Accessories",price:75,image:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=500"},
 {id:5,name:"White Sneakers",category:"Shoes",price:95,image:"https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=500"},
 {id:6,name:"Black T-Shirt",category:"Clothes",price:35,image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"},
];
let currentCat='All';
let email=localStorage.getItem('email')||"";
document.getElementById('email').value=email;
if(email) document.getElementById('who').innerText=email;

function render(list){
 const g=document.getElementById('grid'); g.innerHTML="";
 list.forEach(p=>{
   g.innerHTML+=`<div class="card"><img src="${p.image}"><h3>${p.name}</h3><p>$${p.price}</p><button onclick="addToCart(${p.id})">Add to Cart</button></div>`
 })
}
function filterCat(cat,btn){
 currentCat=cat;
 document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
 if(btn) btn.classList.add('active');
 let list = cat==='All'? PRODUCTS : PRODUCTS.filter(x=>x.category===cat);
 render(list);
}
render(PRODUCTS);

async function login(){
 email=document.getElementById('email').value.trim();
 if(!email) return alert('Enter email');
 localStorage.setItem('email',email);
 document.getElementById('who').innerText=email;
 document.getElementById('status').innerText='Logging in...';
 try{
   let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
   let j=await r.json();
   document.getElementById('status').innerText='Logged in! Cart: '+(j.cart?.length||0);
   document.getElementById('count').innerText=j.cart?.length||0;
 }catch(e){ document.getElementById('status').innerText='Login offline (demo mode) - products still work'; }
}
function logout(){ localStorage.removeItem('email'); email=""; document.getElementById('who').innerText="not logged"; document.getElementById('count').innerText=0; document.getElementById('email').value=""; }
async function addToCart(id){
 if(!email){ alert('Login first with email'); return; }
 document.getElementById('count').innerText=parseInt(document.getElementById('count').innerText)+1;
 try{
  await fetch('/api/cart/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,product_id:id})});
 }catch(e){}
}

// try fetch real products from API, but keep fallback
fetch('/api/products').then(r=>r.json()).then(data=>{
 if(Array.isArray(data)&&data.length>0){ PRODUCTS=data; filterCat(currentCat); }
}).catch(()=>{});
</script>
</body>
</html>
